name: Tests

# Los tests solo se lanzan si el commit o la PR cambia algo que pueda alterar el
# comportamiento del programa. Si TODOS los archivos cambiados están en
# paths-ignore (documentación y configuración de los asistentes de IA), el
# workflow no se ejecuta y no consume minutos.
on:
  push:
    branches:
      - main
      - develop
    paths-ignore: &ignored-paths
      # documentación
      - '**.md'
      - 'LICENSE'
      # configuración de los asistentes de IA (Claude Code, Codex...)
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore: *ignored-paths
  # permite lanzarlo a mano desde la pestaña Actions cuando se quiera forzar
  workflow_dispatch:

# Si llega un commit nuevo a la misma rama o PR, se cancela la ejecución
# anterior, que ya no sirve, en lugar de dejar que termine.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # un job colgado no puede consumir las 6 horas por defecto
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        php-version: [8.1, 8.2, 8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php-version }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: zip, mbstring, ctype
        coverage: xdebug

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run test suite
      run: composer run-script test

